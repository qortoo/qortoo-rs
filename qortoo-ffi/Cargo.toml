[package]
name = "qortoo-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
publish = false

[lib]
name = "qortoo_ffi"
# `rlib` is only there so the integration tests under `tests/` can link this crate;
# the Go binding consumes `staticlib`.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# `observability`: the Go side cannot install a Rust `tracing` subscriber or a `metrics`
# recorder, so this crate drives the core's opt-in installation on its behalf.
qortoo = { path = "..", features = ["observability"] }

# Only what the C ABI adapter itself needs: the entry spans it opens and the W3C
# trace-context bridge. The pipelines live in the core.
tracing = "^0.1.44"
tracing-opentelemetry = "^0.33"
opentelemetry = "^0.32"
opentelemetry_sdk = { version = "^0.32", features = ["trace"] }

[build-dependencies]
cbindgen = "^0.29"

[dev-dependencies]
opentelemetry_sdk = { version = "^0.32", features = ["trace", "testing"] }
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }
metrics-util = { version = "^0.20", features = ["debugging"] }
awaitility = "^0.4"
