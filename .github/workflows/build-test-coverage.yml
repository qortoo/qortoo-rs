name: Build and Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      # Docs/tooling are not build inputs; CI runs neither rustfmt nor the Docker stack.
      - '**/*.md'
      - 'docs/**'
      - 'scripts/check_doc_links.py'
      - 'scripts/check_mermaid.py'
      - '.github/workflows/check-docs.yml'
      - '.github/workflows/developer-site.yml'
      - '.rustfmt.toml'
      - 'LICENSE'
      - '.gitignore'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/assign-reviewers.yml'
      - 'qortoo-rs-docker/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/check_doc_links.py'
      - 'scripts/check_mermaid.py'
      - '.github/workflows/check-docs.yml'
      - '.github/workflows/developer-site.yml'
      - '.rustfmt.toml'
      - 'LICENSE'
      - '.gitignore'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/assign-reviewers.yml'
      - 'qortoo-rs-docker/**'

# One run per branch. Superseded PR runs are cancelled; pushes to main are not,
# so every merged commit keeps its own Codecov report.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  snapshot-features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "snapshot-bitcode"
          - "snapshot-postcard"
          - "snapshot-bitcode,snapshot-postcard"
          - "snapshot-bitcode,snapshot-zstd"
          - "snapshot-postcard,snapshot-zstd"
          - "snapshot-bitcode,snapshot-postcard,snapshot-zstd"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Check snapshot capabilities without workspace feature unification
        env:
          SNAPSHOT_FEATURES: ${{ matrix.features }}
        run: |
          cargo test -p qortoo --doc --no-default-features --features "$SNAPSHOT_FEATURES"
          cargo test -p qortoo --lib --no-default-features --features "$SNAPSHOT_FEATURES" crdts::snapshot::
          cargo test -p qortoo --lib --no-default-features --features "$SNAPSHOT_FEATURES" snapshot_policy
          cargo test -p qortoo --lib --no-default-features --features "$SNAPSHOT_FEATURES" errors::tests_datatype_errors

      - name: Reject builds without a snapshot codec
        if: matrix.features == 'snapshot-bitcode'
        run: |
          for features in "" "snapshot-zstd"; do
            if cargo check -p qortoo --lib --no-default-features --features "$features" > snapshot-feature-error.log 2>&1; then
              echo "Expected a build failure without a snapshot codec"
              exit 1
            fi
            cat snapshot-feature-error.log
            grep -Fq "Enable at least one snapshot codec: snapshot-bitcode or snapshot-postcard." snapshot-feature-error.log
          done

  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test benchmark notifier routing
        run: node --test .github/tests/benchmark-pr-dispatch.test.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.97.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.97.1-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.37.0 --locked

      - name: Build
        run: cargo build --verbose

      - name: Check rustdoc links
        # A [`Foo`]-style doc link only resolves if Foo is compiled in for that
        # same build, so the same link can be valid under one feature
        # combination and broken under another (fa3f0a1 fixed a real case of
        # this). -D rustdoc::broken_intra_doc_links makes that failure loud
        # instead of a silent warning. default and --all-features cover every
        # combination that currently matters; the individual observability-*
        # features were checked by hand and don't branch separately from these two.
        run: |
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links" cargo doc --no-deps
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links" cargo doc --no-deps --all-features

      - name: Check qortoo-ffi ABI contract
        run: |
          make ffi-header-check
          make abi-symbols-check

      - name: Check observability feature boundaries
        run: |
          cargo check --no-default-features --features snapshot-bitcode
          cargo check --no-default-features --features snapshot-bitcode,observability-log
          cargo check --no-default-features --features snapshot-bitcode,observability-trace
          cargo check --no-default-features --features snapshot-bitcode,observability-metrics
          cargo check --no-default-features --features snapshot-bitcode,observability
          cargo test --no-default-features --features snapshot-bitcode --no-run
          cargo test --no-default-features --features snapshot-bitcode,observability-trace --no-run

      - name: Run tests with coverage
        run: |
          cargo tarpaulin \
            --workspace \
            --tests \
            --all-features \
            --engine llvm \
            --fail-under 80 \
            --out Lcov \
            --out html \
            --out xml \
            --output-dir ./coverage

      - name: Generate coverage badge
        run: |
          COVERAGE=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf("%.2f%%\n", (lh/lf)*100)}' ./coverage/lcov.info)
          echo "COVERAGE=$COVERAGE"
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
        id: coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info, ./coverage/cobertura.xml, ./coverage/tarpaulin-report.xml
          slug: qortoo/qortoo-rs
          verbose: true

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const comment = `## 📊 Code Coverage Report

            **Coverage: ${coverage}%**

            📈 Detailed coverage report is available in the artifacts.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
