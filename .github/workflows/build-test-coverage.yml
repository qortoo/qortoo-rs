name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.97.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.97.1-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.37.0 --locked

      - name: Build
        run: cargo build --verbose

      - name: Check observability feature boundaries
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features observability-log
          cargo check --no-default-features --features observability-trace
          cargo check --no-default-features --features observability-metrics
          cargo check --no-default-features --features observability
          cargo test --no-default-features --no-run
          cargo test --no-default-features --features observability-trace --no-run

      - name: Run tests with coverage
        run: |
          cargo tarpaulin \
            --workspace \
            --tests \
            --all-features \
            --engine llvm \
            --fail-under 80 \
            --out Lcov \
            --out html \
            --out xml \
            --output-dir ./coverage \
            --exclude-files 'benches/*'

      - name: Generate coverage badge
        run: |
          COVERAGE=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf("%.2f%%\n", (lh/lf)*100)}' ./coverage/lcov.info)
          echo "COVERAGE=$COVERAGE"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        id: coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info, ./coverage/cobertura.xml, ./coverage/tarpaulin-report.xml
          slug: qortoo/qortoo-rs
          verbose: true

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const comment = `## 📊 Code Coverage Report

            **Coverage: ${coverage}%**

            📈 Detailed coverage report is available in the artifacts.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  go-binding:
    name: Go binding tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/qortoo/go.sum

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ffi-1.97.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ffi-1.97.1-

      - name: Build FFI library
        run: cargo build -p qortoo-ffi

      # The FFI's own tests cover process-global state (observability init/shutdown,
      # trace-context propagation), which needs one process per case — hence separate
      # test binaries rather than a subset of the core suite.
      - name: Run FFI tests
        run: cargo test -p qortoo-ffi

      - name: Run Go tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: |
          cd go/qortoo
          go vet ./...
          go test -race ./...
          go test -race -shuffle=on -count=2 \
            -run '^(TestTraceContext|TestContextAwareOperationsWithoutObservability|TestInitObservability|TestObservability|TestShutdownObservability|TestShutdownTimeout)' \
            ./...
