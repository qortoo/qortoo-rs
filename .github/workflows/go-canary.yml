name: Go binding canary

on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'qortoo/qortoo-rs' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'qortoo/qortoo-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check dispatch credential
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$WORKFLOW_PAT" ]; then
            echo '::error::Configure WORKFLOW_PAT with Actions write access to qortoo/qortoo-go.'
            exit 1
          fi
      - name: Request Go canary for current Rust main
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.WORKFLOW_PAT }}
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: 'qortoo', repo: 'qortoo-go', workflow_id: 'canary.yml', ref: 'main',
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            core.info(`Go canary requested after successful Rust build ${context.payload.workflow_run.html_url}.`);
            if (response.data?.html_url) core.info(`Canary run: ${response.data.html_url}`);
